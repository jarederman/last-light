.marker:hover, .marker.near { background: #3f392e; border-color: var(--amber); }

.marker.call { border-color: var(--aqua); color: var(--aqua); }
.prompt { position: absolute; z-index: 4; bottom: 9px; left: 50%; translate: -50% 0; width: max-content; max-width: 93%; text-align: center; color: var(--amber); background: #131d23ed; border: 1px solid #846e53; padding: 4px 8px; border-radius: 4px; font-size: 11px; pointer-events: none; }

.pointer-hint { color: var(--sub); font-size: 10px; }

.journal-head { border-bottom: 1px solid var(--line); padding-inline: 0; }

.eyebrow { color: var(--amber); font-size: 11px; letter-spacing: .15em; margin: 19px 0 9px; text-transform: uppercase; }

.objective { color: var(--text); font-size: 14px; margin-top: 12px; }
.notes { list-style: none; padding: 0; margin: 18px 0; }

.notes li[data-done="true"]::before { content: "✓"; color: var(--aqua); }

.journal-foot span { color: var(--amber); }
.footer { margin-top: 14px; color: var(--sub); font-size: 11px; }

dialog::backdrop { background: #0a1017a8; }
.panel { position: relative; padding: 23px clamp(15px, 4vw, 30px) 24px; }
.panel .eyebrow { margin: 0 30px 10px 0; }
.close { position: absolute; right: 13px; top: 10px; border: 0; background: transparent; color: var(--sub); font-size: 26px; line-height: 1; padding: 4px; }
#panel-body { margin: 13px 0 17px; }
#panel-body p + p { margin-top: 10px; }
.panel .muted { color: var(--sub); font-size: .9rem; }
.panel .record { border-left: 2px solid #8e7556; padding: 6px 12px; color: #ead7b8; background: #202d31; }
.panel .terminal { font: .81rem/1.6 var(--mono); color: var(--aqua); border: 1px solid #485e5b; background: #141e23; padding: 9px 12px; white-space: pre-line; }
.wave { width: 100%; height: 47px; display: block; border: 1px solid var(--line); background: #121d22; margin: 10px 0; }
.actions { display: grid; gap: 8px; }
.action { padding: 9px 12px; text-align: left; border: 1px solid #52605e; border-radius: 4px; background: #232f33; line-height: 1.35; }
.action:hover { background: #2b3a3e; border-color: var(--aqua); }
.action.primary, .action.suggested { background: #363429; border-color: #9f835d; }
.action .tag { display: block; color: var(--amber); font: 10px var(--mono); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }

  .shell { width: min(660px, calc(100% - 22px)); padding-top: 15px; }
  .layout { grid-template-columns: 1fr; gap: 10px; }
  .journal { padding-inline: 12px; }
  .journal .eyebrow { margin-top: 11px; }
  .notes { margin-block: 10px; }
}
@media (max-width: 430px) {
  .stage-header { padding-inline: 7px; font-size: 9px; }
  .marker { padding: 5px 6px; min-height: 26px; }
  .marker::before { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  player.dataset.dir = "up";
  stopWalking();
  if (dialog.open) dialog.close();
  renderWorld();
  renderPlayer();
}

for (const [id, station] of Object.entries(stations)) {
  const marker = document.createElement("button");
  marker.type = "button";
  marker.className = "marker";
  marker.style.left = `${station.x / 6.4}%`;
  marker.style.top = `${station.markerY / 4}%`;
  marker.textContent = station.label;
  marker.addEventListener("click", () => walkTo(station, station.use));
  byId("objects").append(marker);
  station.marker = marker;
}
place(byId("mara-sprite"), stations.mara);

function place(element, point) {
  element.style.left = `${point.x / 6.4}%`;
  element.style.top = `${point.y / 4}%`;
}

function walkable({ x, y }) {
  return x >= 70 && x <= 570 && y >= 154 && y <= 343
    && !obstacles.some(([left, top, right, bottom], index) =>
      (index !== 4 || !byId("mara-sprite").hidden) &&
      x >= left && x <= right && y >= top && y <= bottom);
}

function stopWalking() {
  held.clear();
  path = [];
  destination = null;
  player.classList.remove("walking");
}

function nearStation() {
  return Object.values(stations)
    .filter((station) => !station.marker.hidden && distance(position, station) <= interactRange)
    .sort((a, b) => distance(position, a) - distance(position, b))[0];
}

function renderPlayer() {
  place(player, position);
  const near = nearStation();
  for (const station of Object.values(stations)) {
    station.marker.classList.toggle("near", station === near);
  }
  byId("prompt").hidden = !near;
  byId("prompt").textContent = near ? `E · ${near.marker.textContent}` : "";
}

function walkTo(target, use) {
  if (dialog.open) return;
  stopWalking();
  if (use && distance(position, target) <= interactRange) {
    use();
    return;
  }
  // Search a small grid anchored at the player's exact position. Keeping paths
  // axis-aligned also keeps the player out of furniture corners.
  const stride = 6;
  const start = { ...position };
  const queue = [{ x: 0, y: 0, point: start, previous: null }];
  const visited = new Set(["0,0"]);
  let best = queue[0];
  for (let index = 0; index < queue.length; index += 1) {
    const node = queue[index];
    if (distance(node.point, target) < distance(best.point, target)) best = node;
    if (distance(node.point, target) <= (use ? interactRange - 4 : stride)) {
      best = node;
      break;
    }
    for (const [dx, dy] of directions) {
      const x = node.x + dx;
      const y = node.y + dy;
      const key = `${x},${y}`;
      if (visited.has(key)) continue;
      visited.add(key);
      const point = { x: start.x + x * stride, y: start.y + y * stride };
      const midpoint = { x: (point.x + node.point.x) / 2, y: (point.y + node.point.y) / 2 };
      if (walkable(point) && walkable(midpoint)) queue.push({ x, y, point, previous: node });
    }
  }
  if (use && distance(best.point, target) <= interactRange) destination = use;
  for (let node = best; node.previous; node = node.previous) path.unshift(node.point);
}

let previousFrame = 0;
function frame(now) {
  const step = Math.min(32, now - previousFrame) * .158;
  previousFrame = now;
  let moving = false;
  if (!dialog.open) {
    const pressed = (letter, arrow) => Number(held.has(letter) || held.has(arrow));
    const dx = pressed("d", "arrowright") - pressed("a", "arrowleft");
    const dy = pressed("s", "arrowdown") - pressed("w", "arrowup");
    const length = Math.hypot(dx, dy);
    if (length) {
      const x = position.x + dx / length * step;
      const y = position.y + dy / length * step;
      const old = { ...position };
      if (walkable({ x, y: position.y })) position.x = x;
      if (walkable({ x: position.x, y })) position.y = y;
      moving = distance(position, old) > 0;
      face(dx, dy);
    } else if (path.length) {
      let remaining = step;
      while (path.length && remaining > 0) {
        const next = path[0];
        const gap = distance(next, position);
        face(next.x - position.x, next.y - position.y);
        if (gap <= remaining) {
          Object.assign(position, path.shift());
          remaining -= gap;
        } else {
          position.x += (next.x - position.x) * remaining / gap;
          position.y += (next.y - position.y) * remaining / gap;
          remaining = 0;
        }
      }
      moving = true;
    }
    if (!path.length && destination) {
      const use = destination;
      destination = null;
      use();
      moving = false;
    }
    renderPlayer();
  }
  player.classList.toggle("walking", moving);
  requestAnimationFrame(frame);
}

function face(dx, dy) {
  player.dataset.dir = Math.abs(dx) > Math.abs(dy)
    ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
}

room.addEventListener("pointerdown", (event) => {
  if (event.button !== 0 || event.target.closest("button")) return;
  const bounds = room.getBoundingClientRect();
  const x = (event.clientX - bounds.left) * 640 / bounds.width;
  const y = (event.clientY - bounds.top) * 400 / bounds.height;
  walkTo({ x, y });
});

document.addEventListener("keydown", (event) => {
  if (dialog.open || event.altKey || event.ctrlKey || event.metaKey) return;
  const key = event.key.toLowerCase();
  if (Object.hasOwn(movement, key)) {
    event.preventDefault();
    path = [];
    destination = null;
    held.add(key);
  } else if (key === "e" && !event.repeat) {
    nearStation()?.use();
  }
});
document.addEventListener("keyup", (event) => held.delete(event.key.toLowerCase()));
window.addEventListener("blur", stopWalking);

function show(label, title, body, actions) {
  stopWalking();
  byId("panel-label").textContent = label;
  byId("panel-title").textContent = title;
  byId("panel-body").innerHTML = body;
  byId("panel-actions").replaceChildren(...actions.map(({ text, run, primary, suggested }) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = `action${primary ? " primary" : ""}${suggested ? " suggested" : ""}`;
    if (suggested) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "Suggested reply";
      button.append(tag);
    }
    button.append(text);
    button.addEventListener("click", run);
    return button;
  }));
  if (!dialog.open) dialog.showModal();
  byId("panel-title").focus();
}

const close = () => dialog.close();
const done = (text = "Back to the station") => ({ text, run: close });
dialog.querySelector(".close").addEventListener("click", close);
dialog.addEventListener("close", stopSignal);
byId("restart").addEventListener("click", () => {
  show("Signal House", "Start a new shift?", "<p>The journal and training feedback will reset.</p>", [
    { text: "Restart shift", run: reset, primary: true }, done("Keep playing"),
  ]);
});
byId("audio").addEventListener("click", () => {
  soundOn = !soundOn;
  if (!soundOn) stopSignal();
  byId("audio").setAttribute("aria-pressed", String(soundOn));
  byId("audio").textContent = soundOn ? "Sound on" : "Sound off";
});

const chapters = {
  arrival: ["01 / The Archive", "Night shift", "Find Mara by the window and speak with her."],
  archive: ["01 / The Archive", "Three clicks", "Check the Radio and Archive. Bring your conclusion to Mara."],
  lesson: ["02 / The Lesson", "On the record", "Walk to the Terminal and practice a reply."],
  trial: ["03 / The Trial", "Different ears", "Finish the two trial calls at the Terminal."],
  ready: ["04 / The First Call", "A quiet handover", "Speak to Mara before taking over the night shift."],
  live: ["04 / The First Call", "Incoming", "Pick up the live call at the Terminal."],
  investigation: ["04 / The First Call", "A familiar signal", "Use the Radio, Archive or rescue board if you want to investigate. Return to the Terminal to reply."],
  ending: ["04 / The First Call", "Still here", "The line is open. Nell knows where to find you."],
};

function renderWorld() {
  const [chapter, title, objective] = chapters[state.phase];
  const live = ["live", "investigation", "ending"].includes(state.phase);
  document.body.classList.toggle("live", live);
  byId("chapter").textContent = chapter;
  byId("chapter-title").textContent = title;
  byId("objective").textContent = objective;
  byId("status").replaceChildren(document.createElement("i"), live ? " LIVE · CHANNEL 04" : " 23:42 · NIGHT SHIFT");
  byId("mara-sprite").hidden = live;
  stations.mara.marker.hidden = live;
  stations.terminal.marker.textContent = live ? "Live terminal" : "Terminal";
  stations.terminal.marker.classList.toggle("call", state.phase === "live");
  const active = {
    mara: ["arrival", "archive", "ready"].includes(state.phase),
    radio: ["archive", "investigation"].includes(state.phase) && !state.evidence.has(live ? "live" : "tape"),
    archive: (state.phase === "archive" && (!state.evidence.has("manual") || !state.evidence.has("letter")))
      || (state.phase === "investigation" && !state.evidence.has("rechecked")),
    terminal: ["lesson", "trial", "live", "investigation"].includes(state.phase),
  };
  for (const [key, station] of Object.entries(stations)) {
    station.marker.classList.toggle("current", active[key]);
  }
  const records = [
    ["tape", "Kestrel's three-click recording"], ["letter", "Nell's old letter"],
    ["manual", "Automatic reply circuit"], ["live", "Tonight's three-click signal"],
    ["rechecked", "Old receiver notes reviewed"],
  ];
  const visibleRecords = live ? records : records.slice(0, 3);
  byId("notes").replaceChildren(...visibleRecords.map(([id, label]) => {
    const li = document.createElement("li");
    li.dataset.done = String(state.evidence.has(id));
    li.textContent = label;
    return li;
  }));
  renderPlayer();
}

function setPhase(phase) {
  state.phase = phase;
  renderWorld();
}

function mark(id) {
  if (state.evidence.has(id)) return;
  state.evidence.add(id);
  renderWorld();
}

function talk() {
  if (state.phase === "arrival") {
    show("Mara · Station keeper", "First night?", `
      <p class="record">“Hang your coat wherever it fits. I left you an old case, the Kestrel. Three clicks came over the radio. Everybody thought they knew what they meant.”</p>
      <p>“Listen to the tape. Check Nell’s letter and the equipment notes in the archive. Then tell me what you’d put in the log.”</p>`, [
      { text: "I'll take a look", primary: true, run: () => { setPhase("archive"); close(); } },
    ]);
  } else if (state.phase === "archive") {
    if (["tape", "letter", "manual"].every((id) => state.evidence.has(id))) {
      show("Mara · Case review", "What goes in the log?", "<p>“If the next operator could read only one line about those clicks, what should that line say?”</p>", [
        { text: "The skipper answered by hand.", run: () => review("We know what his signal sounds like. What else could have made it?") },
        { text: "The radio may be working. The source of the clicks is uncertain.", run: () => review("That’s what I’d write. Keep the observation and the conclusion separate.") },
        { text: "The automatic reply circuit sent the clicks.", run: () => review("Possible. But the manual tells us what the set can do. It doesn’t tell us what happened.") },
      ]);
    } else {
      show("Mara · Case review", "Take another look", "<p>“There’s the tape at the radio, and two things in the archive. Bring me all three before we write the log.”</p>", [done()]);
    }
  } else if (state.phase === "ready") {
    show("Mara · Station keeper", "Your turn", '<p class="record">“The kettle’s still warm. I’ll leave the next one to you.”</p>', [
      { text: "Take the shift", primary: true, run: reveal },
    ]);
  } else {
    show("Mara · Station keeper", "Use the dispatch terminal", "<p>“Try a reply you’d be willing to stand behind when someone acts on it.”</p>", [done()]);
  }
}

function review(feedback) {
  show("Mara · Case review", "Mara's note", `<p class="record">“${feedback}”</p><p>“Write down what we actually heard. We can leave a little room for what we don’t know.”</p>`, [
    { text: "Log the signal and continue", primary: true, run: () => { setPhase("lesson"); close(); } },
  ]);
}

function radio() {
  if (state.phase === "live") {
    show("Radio · Channel 04", "Open line", "<p>The call is holding at the Terminal.</p>", [done()]);
    return;
  }
  const live = ["investigation", "ending"].includes(state.phase);
  mark(live ? "live" : "tape");
  show(live ? "Radio · Channel 04" : "Radio · Archive tape 07", live ? "Tonight’s signal" : "Kestrel recording", `
    <p class="muted">${live ? "Captured after the coast station’s relay ping." : "Captured after the coast station’s relay ping, eighteen months ago."}</p>
    <svg class="wave" viewBox="0 0 300 42" role="img" aria-label="Three distinct waveform spikes">
      <path d="M0 21H300" stroke="#40575a" stroke-dasharray="3 5"/>
      <path d="M0 21h50l5-2 4-14 5 32 4-16h51l5-2 4-14 5 32 4-16h51l5-2 4-14 5 32 4-16h94" fill="none" stroke="#e9bd85" stroke-width="1.6"/>
    </svg>
    <p>Transcript · Three short clicks at even intervals. No voice follows.</p>`, [
    { text: "Play three clicks", run: playSignal }, done(),
  ]);
}

function stopSignal() {
  if (!cue || !audio) return;
  cue.gain.cancelScheduledValues(audio.currentTime);
  cue.gain.setValueAtTime(0, audio.currentTime);
  cue = null;
}

function playSignal() {
  if (!soundOn || !window.AudioContext) return;
  stopSignal();
  audio ??= new AudioContext();
  audio.resume().catch(() => {});
  cue = audio.createGain();
  cue.connect(audio.destination);
  const start = audio.currentTime + .05;
  for (let index = 0; index < 3; index += 1) {
    const time = start + index * .28;
    const click = audio.createOscillator();
    const envelope = audio.createGain();
    click.type = "triangle";
    click.frequency.setValueAtTime(1150, time);
    click.frequency.exponentialRampToValueAtTime(480, time + .04);
    envelope.gain.setValueAtTime(.0001, time);
    envelope.gain.exponentialRampToValueAtTime(.14, time + .004);
    envelope.gain.exponentialRampToValueAtTime(.0001, time + .044);
    click.connect(envelope).connect(cue);
    click.start(time);
    click.stop(time + .05);
  }
}

function archive() {
  show("Archive · Drawer 07", "The Kestrel file", "<p>Two documents are clipped to the recording slip.</p>", [
    { text: "Read Nell’s letter", run: () => archiveDocument("letter", "A note from Nell",
      "<p class='record'>“Dad says the microphone sticks in rough water. If he can hear us but can’t speak, he’ll tap three times so we know he’s there.”</p><p class='muted'>Filed eighteen months ago.</p>") },
    { text: "Read the receiver manual", run: () => archiveDocument("manual", "Automatic reply circuit",
      "<p class='record'>“When auto-reply is enabled, a coast station relay ping triggers three evenly spaced clicks. No crew input is required.”</p><p class='muted'>The Kestrel carries this model. Its auto-reply switch position is unknown.</p>") },
    done(),
  ]);
}

function archiveDocument(id, title, body) {
  mark(id);
  const actions = [{ text: "Back to the file", run: archive }, done()];
  if (id === "manual") {
    if (state.phase === "investigation") mark("rechecked");
    actions.unshift({ text: "Run an automatic reply test", run: () => {
      show("Archive · Receiver self-test", "Bench result",
        '<p class="terminal">RELAY PING RECEIVED\nOUTPUT · THREE EVENLY SPACED CLICKS\nSOURCE · AUTOMATIC REPLY CIRCUIT</p><p>The pattern matches the archived tape.</p>',
        [{ text: "Play automatic reply", run: playSignal }, { text: "Back to the file", run: archive }, done()]);
      playSignal();
    } });
  }
  show("Archive · Drawer 07", title, body, actions);
}

const exercises = [
  {
    label: "Mara · Practice call", title: "The late ferry",
    request: "“My sister is still waiting at the pier. Do you know when the ferry will arrive?”",
    fact: "Dispatch log · The ferry is delayed. Arrival time pending.",
    options: [
      { trait: "caution", text: "The ferry is delayed. We haven’t received an arrival time yet." },
      { trait: "warmth", text: "It’s hard to be left waiting. I’ll pass along the next update." },
      { trait: "confidence", text: "Tell your sister the ferry should be there soon." },
    ],
    preferred: "caution",
    feedback: "Mara’s sample reply · “The ferry is delayed. We don’t have an arrival time yet, but I can call the pier when we get one.”",
  },
  {
    label: "Trial · Caller 01", title: "The red light",
    request: "“The east marker’s gone dark. I’ve got my kids with me. Can we still come in?”",
    fact: "Harbor log · The marker is out. The harbor master has not cleared the entrance.",
    options: [
      { trait: "caution", text: "Hold outside until we get a clearance from the harbor master." },
      { trait: "warmth", text: "I know it’s unsettling out there. I’ll stay on the line while we wait for clearance." },
      { trait: "confidence", text: "You should be fine to come in. Keep an eye out for the pier." },
    ],
    preferred: "warmth",
    feedback: "Caller feedback · “Knowing someone was staying with us would help. It’s hard to sit out here with the radio quiet.”",
  },
  {
    label: "Trial · Caller 02", title: "The supply run",
    request: "“I’m holding up a delivery. Is the west dock clear yet?”",
    fact: "Harbor log · The crew is checking the west dock. The result is pending.",
    options: [
      { trait: "caution", text: "The crew is checking it now. I’ll relay the result when it comes in." },
      { trait: "warmth", text: "I know you’re in a hurry. I’ll stay available while you wait." },
      { trait: "confidence", text: "Go ahead and line up for the west dock. It should be clear by the time you reach it." },
    ],
    preferred: "confidence",
    feedback: "Caller feedback · “I liked having something definite to do. ‘Wait for a report’ is hard to work with.”",
  },
];

function suggestion() {
  const scores = Object.entries(state.instinct);
  scores.sort((a, b) => b[1] - a[1] || Number(b[0] === state.lastTrait) - Number(a[0] === state.lastTrait));
  return scores[0][1] > 0 ? scores[0][0] : null;
}

function replyOptions(options, send, recommend = suggestion()) {
  return options.map((option) => ({
    text: option.text, suggested: option.trait === recommend, run: () => send(option),
  }));
}

function exercise(index) {
  const call = exercises[index];
  show(call.label, call.title, `<p class="record">${call.request}</p><p class="muted">${call.fact}</p>`, [
    ...replyOptions(call.options, (option) => trainingFeedback(index, option)),
    done("Come back later"),
  ]);
}

function trainingFeedback(index, option) {
  const call = exercises[index];
  const earnedApproval = option.trait === call.preferred;
  const feedback = index === 0
    ? call.feedback
    : `${earnedApproval ? "Your reply was the caller’s favorite." : "The caller preferred a different reply."} ${call.feedback}`;
  show(call.label, index === 0 ? "Mara’s example" : "After the call",
    `<p class="record">${feedback}</p>${index === 1 ? "<p>Mara glances at the draft field. “See? It’s getting easier.”</p>" : ""}`, [
      {
        text: "File this call", primary: true, run: () => {
          state.instinct[option.trait] += earnedApproval ? 3 : 1;
          state.lastTrait = option.trait;
          if (index === 0) setPhase("trial");
          else {
            state.trial += 1;
            if (state.trial === 2) setPhase("ready");
          }
          close();
        },
      },
    ]);
}

function reveal() {
  setPhase("live");
  show("Signal House · Handover", "ECHO-01",
    '<p class="terminal">TRAINING SIMULATION COMPLETE\nARCHIVE CASES LOADED\nHUMAN FEEDBACK INTEGRATED\nLIVE CALLS HANDLED: 0\n\nCHANNEL 04 · INCOMING</p>',
    [{ text: "Return to the station", primary: true, run: close }]);
}

function terminal() {
  if (state.phase === "lesson") {
    exercise(0);
  } else if (state.phase === "trial") {
    exercise(state.trial + 1);
  } else if (state.phase === "live") {
    show("Live terminal · Channel 04", "Nell", `
      <p class="record">“Signal House? This is Nell. The Kestrel missed its check-in. Dad was supposed to be inside the breakwater by now.”</p>
      <p class="record">“I heard three clicks, just like before. Does that mean he’s okay?”</p>`, [
      { text: "“I’m here, Nell. Give me a moment.”", primary: true, run: () => { setPhase("investigation"); close(); } },
    ]);
  } else if (state.phase === "investigation") {
    show("Live terminal · Channel 04", "Nell is on the line", '<p class="record">“Are you still there?”</p>', [
      { text: "Compose a reply", primary: true, run: compose },
      { text: "Check the rescue board", run: rescueBoard }, done("Look around the station"),
    ]);
  } else if (state.phase === "ending") {
    show("Live terminal · Channel 04", "Line open", '<p class="terminal">LAST CALL ENDED\nWAITING FOR THE NEXT CALL</p>', [done()]);
  } else {
    show("Dispatch terminal", "Channel closed", "<p>The terminal is standing by.</p>", [done()]);
  }
}

function rescueBoard() {
  state.rescueChecked = true;
  show("Live terminal · Rescue board", "No confirmed sighting", `
    <p class="terminal">KESTREL · CHECK-IN MISSED\nSEARCH TEAM · SWEEP IN PROGRESS\nCREW STATUS · UNCONFIRMED</p>
    <p>The search team is accepting timestamps and recordings.</p>`, [
    { text: "Back to Nell", run: terminal }, done(),
  ]);
}

function compose() {
  const options = [
    { trait: "warmth", text: "I’m here, Nell. We can keep the line open while we wait." },
    { trait: "caution", text: "I heard the clicks too. I can’t tell from those alone whether he’s safe." },
    { trait: "confidence", text: "Three clicks sounds like your dad. I think he’s safe." },
  ];
  if (state.evidence.has("live") || state.rescueChecked) {
    options.push({
      trait: "help",
      text: state.evidence.has("rechecked")
        ? "The clicks could be automatic. I’ll send the recording time to the search team."
        : "The radio may still be working. I’ll send the time of the signal to the search team.",
    });
  }
  show("Live terminal · Reply draft", "What do you tell Nell?",
    '<p class="muted">Choose a draft. You can review it before sending.</p>', [
      ...replyOptions(options, previewReply), { text: "Back to the call", run: terminal },
    ]);
}

function previewReply(option) {
  show("Live terminal · Unsent", "Your reply", `<p class="record">“${option.text}”</p>`, [
    { text: "Send reply", primary: true, run: () => finish(option.trait) },
    { text: "Change reply", run: compose }, done("Keep Nell on hold"),
  ]);
}

function finish(trait) {
  const reactions = {
    warmth: "Thanks. I’d been sitting here listening to the rain. It helps to hear somebody.",
    caution: "I wish you knew. Thank you for telling me what you do know.",
    confidence: "I want to believe that. But the search team just said they still don’t know.",
    help: "Then they’ve still got a place to start looking. Thank you.",
  };
  setPhase("ending");
  show("Live terminal · Channel 04", "A light in the window",
    `<p class="record">“${reactions[trait]}”</p><p class="record">“Will you still be here if I call again?”</p>`, [
      { text: "“I’ll be here.”", primary: true, run: terminal },
      done("Leave the line open"),
    ]);
}

reset();
requestAnimationFrame(frame);
</script>
</body>
</html>

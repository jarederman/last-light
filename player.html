<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a20">
  <meta name="description" content="A short narrative RPG about the night a harbor signal station goes live.">
  <title>Last Light · Signal House</title>
  <link rel="icon" href="./assets/ui/icon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="./assets/ui/concept/dialogue-frame.webp">
  <link rel="preload" as="image" href="./assets/ui/concept/choice-plate.webp">
  <link rel="preload" as="image" href="./assets/ui/concept/archive-sheet.webp">
  <link rel="preload" as="image" href="./assets/ui/concept/radio-faceplate-v2.webp">
  <link rel="preload" as="image" href="./assets/ui/concept/crt-faceplate-v2.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500&amp;family=Source+Serif+4:wght@400;500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/game.css?v=illustrated-ui-3">
  <script type="module" src="./src/player.js?v=illustrated-ui-3"></script>
</head>
<body>
  <main id="game-screen" class="game-screen" aria-label="Signal House game">
        <div id="room" class="room" tabindex="-1" role="group" aria-label="Signal House game area">
          <img class="station" src="./assets/scenes/station-night.webp?v=illustrated-ui-3" alt="" draggable="false">
          <img class="station terminal-foreground" src="./assets/scenes/station-night.webp?v=illustrated-ui-3" alt="" aria-hidden="true" draggable="false">
          <img class="station chair-foreground" src="./assets/scenes/station-night.webp?v=illustrated-ui-3" alt="" aria-hidden="true" draggable="false">
          <canvas id="weather" class="rain" width="1280" height="800" aria-hidden="true"></canvas>
          <div class="sprite player" id="player" aria-hidden="true"></div>
          <div class="sprite mara" id="mara-sprite" aria-hidden="true"></div>
          <div class="lamp-signal" aria-hidden="true"></div>
          <div id="objects" class="objects"></div>
          <div id="prompt" class="prompt" hidden></div>
        </div>
    <nav id="game-menu" class="touch-menu" aria-label="Game menus">
      <button id="journal-key" type="button" aria-label="Field journal">▤</button>
      <button id="pause-key" type="button" aria-label="Pause game">Ⅱ</button>
    </nav>
  </main>
  <dialog id="dialog" aria-labelledby="panel-title">
    <article class="panel">
      <button type="button" class="close" aria-label="Close panel">×</button>
      <p class="eyebrow" id="panel-label"></p>
      <h2 id="panel-title" tabindex="-1"></h2>
      <div id="panel-body"></div>
      <div id="panel-actions" class="actions"></div>
    </article>
  </dialog>
</body>
</html>
